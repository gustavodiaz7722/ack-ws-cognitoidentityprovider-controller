ignore:
  shape_names:
      - AdvancedSecurityAdditionalFlowsType
      - SignInPolicyType
  resource_names:
      - Group
      - IdentityProvider
      - ManagedLoginBranding
      - ResourceServer
      - UserImportJob
      - UserPoolClient
      - UserPoolDomain
  field_paths:
      - PasswordPolicyType.PasswordHistorySize
      - CreateUserPoolInput.UserPoolTier
      - CreateUserPoolOutput.UserPool.UserPoolTier
sdk_names:
  model_name: cognito-identity-provider

resources:
  UserPool:
    exceptions:
        terminal_codes:
          - InvalidParameterException
    renames:
      operations:
        DescribeUserPool:
          input_fields:
            UserPoolId: Id
        UpdateUserPool:
          input_fields:
            UserPoolId: Id
        DeleteUserPool:
          input_fields:
            UserPoolId: Id
        CreateUserPool:
          input_fields:
            PoolName: Name
    fields:
      Tags:
        from:
          operation: TagResource
          path: Tags
      # Lambda trigger cross-resource references (resolve to Function ARN).
      LambdaConfig.CreateAuthChallenge:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.CustomMessage:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.DefineAuthChallenge:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PostAuthentication:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PostConfirmation:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreAuthentication:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreSignUp:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreTokenGeneration:
        # Cognito mirrors PreTokenGeneration (deprecated) and
        # PreTokenGenerationConfig; setting one makes AWS echo the other, so
        # late-init both leaves to absorb the mirrored value and avoid a diff.
        late_initialize:
          skip_incomplete_check: {}
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreTokenGenerationConfig:
        late_initialize:
          skip_incomplete_check: {}
      LambdaConfig.UserMigration:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.VerifyAuthChallengeResponse:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.CustomEmailSender.LambdaARN:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.CustomSMSSender.LambdaARN:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreTokenGenerationConfig.LambdaARN:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.KMSKeyID:
        references:
          resource: Key
          service_name: kms
          path: Status.ACKResourceMetadata.ARN
      SmsConfiguration.SNSCallerARN:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
      # set:ignore keeps the Create/Update response from overwriting the nested
      # *Ref fields; late_initialize absorbs the empty LambdaConfig{} AWS returns
      # when lambdaConfig is omitted (avoids a perpetual diff).
      LambdaConfig:
        late_initialize:
          skip_incomplete_check: {}
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
      SmsConfiguration:
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/user_pool/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/user_pool/sdk_read_one_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/user_pool/sdk_update_pre_build_request.go.tpl