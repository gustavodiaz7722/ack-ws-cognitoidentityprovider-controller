ignore:
  shape_names:
      - AdvancedSecurityAdditionalFlowsType
      - SignInPolicyType
  resource_names:
      - Group
      - IdentityProvider
      - ManagedLoginBranding
      - ResourceServer
      - UserImportJob
      - UserPoolClient
      - UserPoolDomain
  field_paths:
      - PasswordPolicyType.PasswordHistorySize
      - CreateUserPoolInput.UserPoolTier
      - CreateUserPoolOutput.UserPool.UserPoolTier
sdk_names:
  model_name: cognito-identity-provider

resources:
  UserPool:
    exceptions:
        terminal_codes:
          - InvalidParameterException
    renames:
      operations:
        DescribeUserPool:
          input_fields:
            UserPoolId: Id
        UpdateUserPool:
          input_fields:
            UserPoolId: Id
        DeleteUserPool:
          input_fields:
            UserPoolId: Id
        CreateUserPool:
          input_fields:
            PoolName: Name
    fields:
      Tags:
        from:
          operation: TagResource
          path: Tags
      # Cross-resource references to lambda Functions for the UserPool Lambda
      # triggers. All Lambda trigger fields resolve to the target Function's ARN.
      LambdaConfig.CreateAuthChallenge:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.CustomMessage:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.DefineAuthChallenge:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PostAuthentication:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PostConfirmation:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreAuthentication:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreSignUp:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreTokenGeneration:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.UserMigration:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.VerifyAuthChallengeResponse:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.CustomEmailSender.LambdaARN:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.CustomSMSSender.LambdaARN:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.PreTokenGenerationConfig.LambdaARN:
        references:
          resource: Function
          service_name: lambda
          path: Status.ACKResourceMetadata.ARN
      LambdaConfig.KMSKeyID:
        references:
          resource: Key
          service_name: kms
          path: Status.ACKResourceMetadata.ARN
      SmsConfiguration.SNSCallerARN:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
      # The reference fields above live inside the nested LambdaConfig and
      # SmsConfiguration structs. Without the set:ignore blocks below, the
      # Create/Update API response (which carries the resolved concrete ARNs but
      # has no concept of the *Ref fields) is written back into the spec on
      # readback, overwriting the parent struct and dropping the user-supplied
      # *Ref fields. Ignoring the response on the Create/Update paths preserves
      # the *Ref in the stored spec, while sdkFind (ReadOne) still observes the
      # real value for delta comparison.
      LambdaConfig:
        # late_initialize absorbs the empty LambdaConfig{} that DescribeUserPool
        # returns when the user omits lambdaConfig. Without it, set:ignore leaves
        # the desired spec nil while ReadOne observes {}, producing a perpetual
        # diff for the common "no lambda triggers" case. When a *Ref is supplied,
        # references resolve before late-init and the struct is already populated,
        # so the copy guard skips it and the ref is preserved. skip_incomplete_check
        # keeps a legitimately-absent config from trapping the resource in
        # incomplete late-initialization.
        late_initialize:
          skip_incomplete_check: {}
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
      SmsConfiguration:
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/user_pool/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/user_pool/sdk_read_one_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/user_pool/sdk_update_pre_build_request.go.tpl